<svg xmlns="http://www.w3.org/2000/svg" width="904" height="180" viewBox="0 0 904 180" role="img" aria-labelledby="title desc">
  <title id="title">Auto-Loop 科研探索回环</title>
  <desc id="desc">每轮对齐 Idea，依据领域知识探索方法，以实际证据和独立审查判断进展。需要补证时返回 Idea；达标或到达运行边界时收尾恢复。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="904" height="180" rx="8" fill="#ffffff"/>
  <g fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M 190 53 H 246"/>
    <path d="M 422 53 H 478"/>
    <path d="M 654 53 H 710"/>
    <path d="M 567 92 V 130 H 103 V 94"/>
  </g>
  <g stroke-width="1.5">
    <rect x="16" y="14" width="174" height="78" rx="7" fill="#eaf3fa" stroke="#0072b2"/>
    <rect x="248" y="14" width="174" height="78" rx="7" fill="#fff3e8" stroke="#d55e00"/>
    <rect x="480" y="14" width="174" height="78" rx="7" fill="#f2f4f5" stroke="#53616b"/>
    <rect x="712" y="14" width="174" height="78" rx="7" fill="#f2f4f5" stroke="#53616b"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" fill="#24343f">
    <g font-size="18" font-weight="600">
      <text x="103" y="44">每轮对齐 Idea</text>
      <text x="335" y="44">探索方法</text>
      <text x="567" y="44">研究判断</text>
      <text x="799" y="44">收尾与恢复</text>
    </g>
    <g font-size="16">
      <text x="103" y="71">核心问题与边界</text>
      <text x="335" y="71">领域依据与检验</text>
      <text x="567" y="71">指导分析 · 独立审查</text>
      <text x="799" y="71">发现、局限与恢复</text>
    </g>
    <text x="335" y="159" font-size="15" fill="#475569">允许的反馈与补证 · 返回 Idea</text>
  </g>
</svg>
